name: Test

on:
  push:
    branches: [main]
    paths: ["crates/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/**"]
  pull_request:
    paths: ["crates/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/**"]

# One active run per ref: a superseded push to the same PR/branch cancels the
# in-flight run instead of racing it to completion. `push` is limited to
# `main` above, so a PR branch is tested exactly once per push (via the
# pull_request event) instead of twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      # Also stands in for the per-crate `cargo check --all-features` legs
      # that used to run in the test job (transport G7, VLESS G3): clippy is
      # a strict superset of check.
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Doc check
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache ssserver binary
        id: cache-ssserver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ssserver
          key: ssserver-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install ssserver
        if: steps.cache-ssserver.outputs.cache-hit != 'true'
        # --force: on a Cargo.lock change this step's cache misses, but the
        # rust-cache restore may already have an ssserver in ~/.cargo/bin,
        # and a plain `cargo install` refuses to overwrite it.
        run: cargo install shadowsocks-rust --features "stream-cipher aead-cipher-2022" --locked --force

      - name: Install simple-obfs (obfs-local / obfs-server)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends simple-obfs
          # Fail fast if either binary is missing — the obfs integration tests
          # rely on both being on PATH (otherwise they would silently SKIP).
          command -v obfs-local
          command -v obfs-server

      - name: Build
        run: cargo build --tests

      # One workspace-scoped invocation for every default-features test
      # target. A single invocation keeps a single feature-resolution scope,
      # so every target reuses the `cargo build --tests` artifacts instead of
      # re-unifying features (and rebuilding shared deps) per `-p`-scoped
      # step. `cargo test -p meow-dns --lib` was folded in: `--lib` already
      # runs every crate's lib tests, meow-dns included.
      - name: Unit + integration tests (default features)
        run: |
          cargo test --lib --bin meow \
            --test common_test \
            --test socks5_udp_user \
            --test dns_cache_test \
            --test config_test \
            --test statistics_test \
            --test rules_test \
            --test api_test \
            --test raii_guard_test \
            --test http_connection_close \
            --test config_persistence_test \
            --test systemd_config_test \
            --test trojan_integration \
            --test vless_config_test \
            --test vless_integration \
            --test v2ray_plugin_integration \
            --test pre_resolve_test \
            --test tls_test \
            --test ws_test \
            --test crate_invariants_test \
            --test crate_publish_metadata_test \
            -- --nocapture

      - name: UDP routing regression (SOCKS5, Shadowsocks, TUN)
        run: cargo test -p meow-listener --all-features --lib udp_port_53

      # ADR-0008 allocation-count gates. Release build: the thresholds are
      # calibrated against release codegen. The provider-backed pressure
      # test self-skips when geodata files are absent (as on CI runners);
      # the remaining gates run everywhere.
      - name: Allocation-count gates (ADR-0008)
        run: cargo test -p meow-tunnel --test alloc_count_test --release -- --nocapture

      # Kept as its own step: MIHOMO_REQUIRE_INTEGRATION_BINS flips *every*
      # suite that probes for external binaries from skip to fail (e.g.
      # vless_integration probes for xray, which is not installed here), so
      # it must only wrap the suite whose binaries are installed above.
      - name: Shadowsocks integration tests (incl. simple-obfs)
        env:
          # Force-fail (instead of silently SKIP) if ssserver / obfs-local /
          # obfs-server are missing on PATH — they are installed above.
          MIHOMO_REQUIRE_INTEGRATION_BINS: "1"
        run: cargo test --test shadowsocks_integration -- --nocapture

      - name: Docker integration tests (Hysteria2 + Snell v3)
        env:
          MEOW_REQUIRE_DOCKER: "1"
        run: |
          cargo test -p meow-proxy --features "hysteria2,snell" \
            --test hysteria2_integration \
            --test snell_server_docker_integration \
            -- --nocapture

      - name: AnyTLS unit and integration tests (embedded server)
        run: |
          cargo test -p meow-anytls --lib
          cargo test -p meow-proxy --features anytls --lib \
            --test anytls_integration --test anytls_leak

      # One invocation/feature set for the feature-gated transport suites.
      # Per-feature-combination *compile* coverage (the old G1-G6 matrix)
      # lives in the feature-powerset job; the nightly coverage workflow
      # runs these same tests under --all-features.
      - name: Transport feature-gated tests (gRPC / H2 / HTTPUpgrade)
        run: |
          cargo test -p meow-transport --features "grpc,h2,httpupgrade" \
            --test grpc_test \
            --test h2_test \
            --test httpupgrade_test \
            -- --nocapture

  features:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: features

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # Capped powerset: --depth 2 covers the empty set, every single feature,
      # and every pair — enough for the real-world cfg-interaction bugs while
      # keeping the leg count ~n^2 instead of ~2^n (meow-proxy: 66 legs,
      # ~129 across the four crates — cargo-hack dedups subsets that resolve
      # to identical builds). Same trade-off tokio (--depth 2 --keep-going)
      # and quinn (--depth 3 --no-dev-deps) make in their PR CI.
      # --no-dev-deps: dev-dependencies are irrelevant to a compile check and
      # dominate per-leg build time. Deeper combinations (3+ features) run
      # nightly in .github/workflows/feature-powerset-daily.yml; the
      # --all-features legs (transport G7, VLESS G3) are covered by clippy
      # --all-features in the lint job.
      - name: Feature powerset (depth 2) — meow-transport
        # `tls` is BoringSSL (boring-sys builds once and is cached across
        # legs); `boring-tls` is a no-op alias of it, so skip that duplicate.
        run: cargo hack check -p meow-transport --feature-powerset --depth 2 --no-dev-deps --exclude-features boring-tls

      - name: Feature powerset (depth 2) — meow-proxy
        run: cargo hack check -p meow-proxy --feature-powerset --depth 2 --no-dev-deps

      - name: Feature powerset (depth 2) — meow-listener
        run: cargo hack check -p meow-listener --feature-powerset --depth 2 --no-dev-deps

      - name: Feature powerset (depth 2) — meow-dns
        run: cargo hack check -p meow-dns --feature-powerset --depth 2 --no-dev-deps

  msrv:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Read MSRV from workspace Cargo.toml
        id: msrv
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV: $msrv"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Cargo check on MSRV toolchain
        run: cargo check --workspace --all-targets

  windows:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows

      # lwIP (listener-tun, in the `full` default bundle) uses bindgen.
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Fetch wintun.dll
        shell: bash
        run: |
          bash scripts/fetch-wintun.sh --target x86_64-pc-windows-msvc --outdir "$RUNNER_TEMP/wintun"
          echo "MEOW_WINTUN_DLL=$RUNNER_TEMP/wintun/wintun.dll" >> "$GITHUB_ENV"

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Build
        run: cargo build --tests

      # Single workspace-scoped invocation — same rationale as the ubuntu
      # test job: one feature-resolution scope, no per-step rebuilds (the
      # old `-p`-scoped steps re-unified features and spent minutes
      # relinking on the Windows runner).
      - name: Unit + integration tests (windows)
        shell: bash
        run: |
          cargo test --lib --bin meow \
            --test common_test \
            --test config_test \
            --test rules_test \
            --test api_test \
            --test trojan_integration \
            --test tls_test \
            --test ws_test \
            --test crate_publish_metadata_test \
            -- --nocapture

      # TUN inbound tests: `listener-tun` is not a default feature, so the
      # workspace --lib leg above never compiles or runs the tun module's
      # tests. This leg covers the Windows-only DnsGuard logic (backup
      # filtering, batched restore-script generation, and a read-only smoke
      # test of the real PowerShell/registry backup path) plus the
      # platform-neutral TUN routing-loop guard.
      - name: meow-listener TUN tests (listener-tun)
        run: cargo test -p meow-listener --features listener-tun --lib -- --nocapture

  macos:
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos

      - name: Build
        run: cargo build --tests

      - name: Core smoke tests
        run: |
          cargo test --lib --bin meow \
            --test common_test \
            --test config_test \
            --test rules_test \
            --test api_test \
            --test trojan_integration \
            --test tls_test \
            --test ws_test \
            --test crate_publish_metadata_test \
            -- --nocapture

      # `listener-tun` is not a default feature; this leg runs the tun
      # module's tests — notably the macOS regression guard that an unset
      # `tun.device` never invents a name (tun-rs rejects non-`utunN`).
      - name: meow-listener TUN tests (listener-tun)
        run: cargo test -p meow-listener --features listener-tun --lib -- --nocapture

  tproxy:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: TProxy integration tests
        run: bash tests/test_tproxy_qemu.sh

  # OpenWrt packaging e2e (#284): boots an armsr/armv8 OpenWrt image in QEMU,
  # installs the meow + luci-app-meow ipks, and verifies service, API, web
  # panel and proxying inside the guest.
  openwrt:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: openwrt-e2e

      - name: Install cargo-zigbuild and zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - run: cargo install --locked cargo-zigbuild

      - name: Install qemu and expect
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm expect

      - name: Cache OpenWrt image
        uses: actions/cache@v4
        with:
          path: target/openwrt-images
          # Keyed on the test script so bumping OPENWRT_VERSION refreshes it.
          key: openwrt-image-armsr-armv8-${{ hashFiles('tests/test_openwrt_qemu.sh') }}

      - name: OpenWrt QEMU e2e tests
        run: bash tests/test_openwrt_qemu.sh
